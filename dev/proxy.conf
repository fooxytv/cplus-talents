# Local stand-in for what Cloudflare does in production: one origin, two apps,
# split on the path. Without this, /sim only exists on its own port locally and
# you cannot test the real URL shape until it is already public.
#
# Keep the rules in the same order as the tunnel's public hostnames: the most
# specific path first, the catch-all last.

server {
  listen 8080;
  server_name _;

  # Docker's embedded DNS. nginx resolves an upstream hostname ONCE at startup
  # unless the address comes from a variable, so without these two lines a
  # rebuilt app container keeps its old IP here - and since Docker reuses
  # addresses, requests can quietly land on the wrong container rather than
  # failing loudly. Re-resolving every ten seconds costs nothing and means
  # `docker compose up --build` never needs the proxy restarted after it.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # the race
  location /sim {
    set $sim_upstream http://sim:8080;
    proxy_pass $sim_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # everything else is the calculator
  location / {
    set $talents_upstream http://talents:8080;
    proxy_pass $talents_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
