<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Talent calculator">
  <!-- A talent grid: four cells, three of them spent. Carries its own dark tile so
       it reads on light and dark browser chrome alike, and stays legible at 16px -
       which is why it is four blocks and not a tree with thin arrows. -->
  <rect width="32" height="32" rx="7" fill="#0f1014"/>
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="6" fill="none" stroke="#6a5a22" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="9" height="9" rx="2" fill="#ffd100"/>
  <rect x="17.5" y="5.5" width="9" height="9" rx="2" fill="#ffd100"/>
  <rect x="5.5" y="17.5" width="9" height="9" rx="2" fill="#4a4b54"/>
  <rect x="17.5" y="17.5" width="9" height="9" rx="2" fill="#ffd100"/>
</svg>
